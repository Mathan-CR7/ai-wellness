# ===========================================================================
# ai-wellness-service - Base Application Configuration
#
# IMPORTANT: This file contains NO secrets and NO hardcoded business data.
#
# All secrets (DB_PASSWORD, JWT_SECRET, GEMINI_API_KEY) MUST be supplied
# as environment variables at runtime.
#
# Profile-specific overrides live in:
#   application-dev.properties   -- local development
#   application-test.properties  -- integration tests (H2)
#   application-prod.properties  -- production (injected by CI/CD or Docker secrets)
# ===========================================================================

# ---------------------------------------------------------------------------
# Application
# ---------------------------------------------------------------------------
spring.application.name=ai-wellness-service
server.address=0.0.0.0
# ---------------------------------------------------------------------------
# Database - all sensitive values come from environment variables
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/wellness?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:wellness_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool
spring.datasource.hikari.pool-name=WellnessPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

# ---------------------------------------------------------------------------
# JPA / Hibernate
# NEVER use 'create' or 'create-drop' in production.
# Schema is managed exclusively by Flyway migrations.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ---------------------------------------------------------------------------
# Flyway - database migrations
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.clean-on-validation-error=true
spring.flyway.clean-disabled=false
spring.flyway.out-of-order=true
spring.flyway.table=schema_version

# ---------------------------------------------------------------------------
# Spring AI - Gemini via OpenAI-compatible API
# Google exposes Gemini through an OpenAI-compatible endpoint.
# Use your Google AI Studio API key — no GCP project needed.
# Get a free key at: https://aistudio.google.com/app/apikey
# ---------------------------------------------------------------------------
spring.ai.openai.api-key=${GEMINI_API_KEY:dummy-key-for-boot}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.chat.options.model=${GEMINI_MODEL:gemini-1.5-flash}
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.max-tokens=2048

# ---------------------------------------------------------------------------
# WebSocket
# ---------------------------------------------------------------------------
spring.websocket.message-size-limit= 65536
spring.websocket.send-buffer-size= 524288
spring.websocket.send-time-limit= 20000

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024
server.servlet.context-path=/

# ---------------------------------------------------------------------------
# Actuator / Management
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# ---------------------------------------------------------------------------
# Application-specific properties
# All values are configurable - none are hardcoded business data.
# ---------------------------------------------------------------------------

# JWT - No default for secret - MUST be set via env var
app.jwt.secret=${JWT_SECRET:dev_secret_key_must_be_at_least_64_bytes_long_for_security_1234567890_wellness} 
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}                                                         
app.jwt.refresh-exp-ms=${JWT_REFRESH_EXP_MS:604800000}                                                      

# CORS
app.cors.allowed-origins= ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}

# Activity domain thresholds (configurable, not hardcoded data)
app.activity.min-valid-steps=${ACTIVITY_MIN_VALID_STEPS:0}
app.activity.max-daily-steps=${ACTIVITY_MAX_DAILY_STEPS:100000}
app.activity.summary-week-days=${ACTIVITY_SUMMARY_WEEK_DAYS:7}

# AI behaviour
app.ai.chat-history-limit=${AI_CHAT_HISTORY_LIMIT:20}
app.ai.streaming-enabled=${AI_STREAMING_ENABLED:true}
app.ai.system-prompt-prefix=You are an AI-powered physical wellness assistant. \
  You help users understand their real activity data, suggest evidence-based \
  movement routines, and provide personalised wellness guidance. Always base \
  your responses on actual user data retrieved through available tools. Do not \
  guess or invent activity values. If data is unavailable, say so clearly and \
  suggest how the user can obtain it. Never provide medical diagnoses; \
  recommend professional medical advice for health concerns.

# Inactivity Detection Configuration
app.inactivity.min-duration-minutes=${INACTIVITY_MIN_MINUTES:120}
app.inactivity.max-duration-minutes=${INACTIVITY_MAX_MINUTES:180}
app.inactivity.check-interval-ms=${INACTIVITY_CHECK_INTERVAL_MS:60000}

# OpenAPI server URL
app.openapi.server-url=${APP_SERVER_URL:http://localhost:8080}

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.kovanlabs.wellness=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.ai=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/wellness-service.log