# ===========================================================================
# PROD profile - production overrides
#
# ALL secrets MUST come from environment variables / Docker secrets.
# No defaults for sensitive values - startup will fail fast if not supplied.
# ===========================================================================

# JPA - Flyway controls schema; Hibernate only validates
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway - strict settings in production
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false

# Server - never expose internal errors in production
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Actuator - hide health details from public in production
management.endpoint.health.show-details=never

# Logging - minimal noise in production
logging.level.root=WARN
logging.level.com.kovanlabs.wellness=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
