# ===========================================================================
# TEST profile - integration test overrides
#
# Uses H2 in-memory database so tests run without MySQL.
# Flyway is disabled - Hibernate creates the schema from entities.
# ===========================================================================

# H2 in-memory database (MySQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:wellness_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 - Hibernate creates schema; do NOT set database-platform (H2 auto-detects)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway disabled - H2 schema managed by Hibernate create-drop
spring.flyway.enabled=false

# Spring AI - test values (no real API calls in tests)
spring.ai.vertex.ai.gemini.project-id=test-project
spring.ai.vertex.ai.gemini.location=us-central1
spring.ai.vertex.ai.gemini.chat.options.model=gemini-1.5-flash

# JWT - test secret (safe for tests only, never use in production)
app.jwt.secret=test-jwt-secret-for-unit-tests-only-not-production-64-chars-long!!
app.jwt.expiration-ms=3600000
app.jwt.refresh-exp-ms=86400000

# CORS
app.cors.allowed-origins=http://localhost:3000

# Activity thresholds
app.activity.min-valid-steps=0
app.activity.max-daily-steps=100000
app.activity.summary-week-days=7

# AI behaviour
app.ai.chat-history-limit=5
app.ai.streaming-enabled=false
app.ai.system-prompt-prefix=Test wellness assistant.

# OpenAPI
app.openapi.server-url=http://localhost:8080

# Logging - minimal for tests
logging.level.root=WARN
logging.level.com.kovanlabs.wellness=DEBUG
