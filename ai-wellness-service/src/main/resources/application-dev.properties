# ===========================================================================
# DEV profile - local development overrides
#
# Activated with: --spring.profiles.active=dev
#
# IMPORTANT: Even in dev, no fake business data is loaded automatically.
# If you need seed data for manual testing, use:
#   - src/main/resources/db/migration/dev/  (Flyway dev-only migrations)
#   - OR manually POST to the REST API after startup
# The production application must start cleanly without demo data.
# ===========================================================================

# Show SQL for local debugging only
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway dev locations & resilience settings
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-on-validation-error=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# Relax CORS for local frontend development
spring.datasource.url=jdbc:mysql://localhost:3306/wellness_dev?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true

# CORS - allow all local frontend ports
app.cors.allowed-origins=http://localhost:3000,http://localhost:8081,http://localhost:5173

# More verbose AI context in dev to aid debugging
app.ai.chat-history-limit=10
app.ai.streaming-enabled=true

# Logging — clean dev output
# Root at INFO keeps console readable.
# Your app code stays at DEBUG so you see what matters.
logging.level.root=INFO
logging.level.com.kovanlabs.wellness=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.ai=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
